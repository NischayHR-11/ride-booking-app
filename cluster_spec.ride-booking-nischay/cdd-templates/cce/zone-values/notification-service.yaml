zea-2026-b02-nischay-ride-booking-notification-service:
  enabled: true
  envProperties:
    CLUSTER_NAME: {{ .Release.Namespace }}
    ENVIRONMENT: dev
    LOGGING_PIPELINE: KINESIS_AND_SOUT
    METRIC_LOG_FORMAT: JSON
    server.port: 8080
    atropos.publish.mode: 'KINESIS'

    spring.jpa.hibernate.ddl-auto: validate
    
    # Inter-service communication
    ride.service.url: https://zea-2026-b02-nischay-ride-booking-ride-service-{{ .Release.Namespace.Stripped }}.internal.cce.zetaapps.in
    driver.service.url: https://zea-2026-b02-nischay-ride-booking-driver-service-{{ .Release.Namespace.Stripped }}.internal.cce.zetaapps.in

    # DB configs
    spring.datasource.url: vault:secrets/data/cluster/{{ .Release.Namespace }}/zea-2026-b02-nischay-ride-booking-notification-service/tenants/0/ganymede/nischaynotif/master#jdbc.url
    spring.datasource.username: vault:secrets/data/cluster/{{ .Release.Namespace }}/zea-2026-b02-nischay-ride-booking-notification-service/tenants/0/ganymede/nischaynotif/master#username
    spring.datasource.password: vault:secrets/data/cluster/{{ .Release.Namespace }}/zea-2026-b02-nischay-ride-booking-notification-service/tenants/0/ganymede/nischaynotif/master#password
